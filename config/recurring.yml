# Tâches planifiées de Solid Queue (https://github.com/rails/solid_queue#recurring-tasks).

production:
  # Le statut d'un joueur (Loué / Disponible) dérive de ses prêts : il change le jour où un
  # prêt commence et le lendemain de sa fin, sans action de personne.
  update_player_availability:
    class: UpdatePlayerAvailabilityJob
    schedule: every day at 0:05
